[project]
name = "sped-hub"
version = "0.15.1"
description = "Plataforma multiempresa de conformidade fiscal para escritórios contábeis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SPED-HUB" }]
keywords = ["sped", "ecd", "efd", "ecf", "contabilidade", "fiscal", "nf-e"]

dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "weasyprint>=60",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
    "unidecode>=1.3",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "strawberry-graphql>=0.200",
    "redis>=5.0",
    "playwright>=1.40",
]

[project.optional-dependencies]
# Driver PostgreSQL — opcional: só quem aponta DATABASE_URL para Postgres
# precisa dele.  `pip install -e ".[postgres]"`
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # httpx é exigido por starlette.testclient (TestClient) — sem ele
    # 5 arquivos de teste falham já na coleta.
    "httpx>=0.27",
    # Lint e format ficam PINADOS: são ferramentas cujo conjunto de regras
    # e estilo mudam entre minor releases.  Sem pin, o CI passa a falhar
    # sozinho quando uma versão nova sai (foi o que aconteceu com o salto
    # ruff 0.4 → 0.16).  Atualize deliberadamente, em um commit próprio.
    "black==26.5.1",
    "ruff==0.16.0",
]

[project.scripts]
sped-hub = "src.cli:main"
sped-hub-dashboard = "src.dashboard.app:main"
sped-hub-watchdog = "src.watchdog:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

# O conjunto de regras é declarado explicitamente.  Sem `select`, o ruff
# aplica os defaults da versão instalada — que crescem a cada release e
# transformam qualquer upgrade em CI vermelho.
[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    # Comprimento de linha é responsabilidade do black (mesmo line-length).
    # Manter as duas ferramentas opinando gera conflito em strings longas.
    "E501",
    # `= Depends(...)`, `= Query(...)`, `= File(...)` são o idioma do
    # FastAPI: chamada em argumento default é intencional aqui.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Testes usam `pytest.raises(Exception)` em asserts de contrato amplo.
"tests/*" = ["B017"]

[tool.black]
line-length = 100
target-version = ["py311"]
