[project]
name = "sped-hub"
version = "0.15.0"
description = "Plataforma multiempresa de conformidade fiscal para escritórios contábeis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SPED-HUB" }]
keywords = ["sped", "ecd", "efd", "ecf", "contabilidade", "fiscal", "nf-e"]

dependencies = [
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "weasyprint>=60",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
    "unidecode>=1.3",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "strawberry-graphql>=0.200",
    "redis>=5.0",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
]

[project.scripts]
sped-hub = "src.cli:main"
sped-hub-dashboard = "src.dashboard.app:main"
sped-hub-watchdog = "src.watchdog:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
