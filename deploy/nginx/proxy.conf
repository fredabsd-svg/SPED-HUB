# Repasse para o FastAPI.  Fica num include porque os dois server blocks o
# usam: o HTTPS sempre, e o HTTP quando não há certificado real (aí não faz
# sentido redirecionar para um HTTPS que o navegador vai recusar).
#
# O endereço vai numa variável de propósito.  Com o nome do host escrito
# direto (ou num bloco `upstream`), o nginx resolve o DNS uma única vez, ao ler
# a configuração, e guarda o IP para sempre.  Duas consequências:
#
#   * recriar o `web` (`docker compose up -d --force-recreate web`, ou qualquer
#     `up` depois de mudar a imagem) lhe dá um IP novo.  O nginx seguia
#     mandando para o IP antigo e devolvia 502 em tudo até alguém reiniciá-lo —
#     falha silenciosa, porque o `web` estava saudável;
#   * subir o nginx sem o `web` no ar (`--no-deps`, por exemplo) era erro fatal:
#     `nginx: [emerg] host not found in upstream "web:8000"`, e o container
#     entrava no mesmo laço de reinício do certificado ausente.
#
# Com a variável, a resolução passa a ser por requisição, contra o DNS do
# Docker: o IP novo é encontrado sozinho, e a ausência do backend vira 502 em
# vez de container morto.
set $sped_hub_backend "web:8000";
proxy_pass http://$sped_hub_backend;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# Timeouts para uploads grandes
proxy_read_timeout 300s;
proxy_send_timeout 300s;
proxy_connect_timeout 60s;
