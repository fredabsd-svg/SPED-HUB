# Metadados do Leiaute 9 da ECD.
# A partir do ano-calendário 2020.
#
# Procedência (§8.1): os campos abaixo foram conferidos campo a campo contra o
# Manual de Orientação do Leiaute 9 da ECD, Anexo ao Ato Declaratório Executivo
# Cofis nº 01/2026 (atualização: janeiro de 2026) — a versão vigente, que
# sucede o ADE Cofis nº 57/2023 que este arquivo citava antes.  Não vale a
# validade de 180 dias da §8.2: o leiaute muda por ano-calendário, não por
# informe técnico, e um prazo curto deixaria o CI vermelho sem defeito.
#
# Só entram aqui os campos fixos do leiaute.  Os campos de moeda funcional
# (VL_*_MF), que o manual descreve depois de "I - Observações" nos registros
# I155, I157, I200, I250, I310 e I355, não são fixos: a pessoa jurídica os
# cria via registro I020 quando IDENT_MF do 0000 é "S".  Como o parser lê por
# posição e esses campos vêm no fim da linha, ignorá-los é correto.

