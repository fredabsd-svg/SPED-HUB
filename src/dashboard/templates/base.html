<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Área privada de gestão contábil e conformidade fiscal do escritório.">
    <title>{% block title %}SPED-HUB{% endblock %}</title>
    <script src="/static/vendor/htmx-1.9.12.min.js"></script>
    <script defer src="/static/vendor/alpine-3.14.1.min.js"></script>
    <script src="/static/vendor/chart-4.4.4.umd.min.js"></script>
    <style>
        /* Fontes servidas pela própria aplicação (/static/fonts): sem
           requisição externa, como manda a §4.3.  O resto do visual — tokens,
           componentes e o shell com menu lateral — vem de app-shell.css. */
        @font-face {
            font-family: 'Source Serif 4';
            src: url('/static/fonts/SourceSerif4-Semibold.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Source Sans 3';
            src: url('/static/fonts/SourceSans3-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Source Sans 3';
            src: url('/static/fonts/SourceSans3-Semibold.ttf') format('truetype');
            font-weight: 500 700;
            font-style: normal;
            font-display: swap;
        }
    </style>
    <link rel="icon" href="/static/marca.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0C3A30">
    <link rel="stylesheet" href="/static/app-shell.css">
    <script defer src="/static/quick-access.js"></script>
    <script defer src="/static/app-shell.js"></script>
    {% block head %}{% endblock %}
</head>
<body class="{% if usuario %}app-layout{% else %}auth-layout{% endif %}">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    {% include "partials/navigation.html" %}
    {% include "partials/quick_access.html" %}

    <main class="main-content" id="main-content" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    {% if usuario %}
    <footer class="footer">
        SPED-HUB v{{ app_version }} · conformidade fiscal e contábil
    </footer>
    {% endif %}

    <script>
        // Login e registro respondem {"status":"ok","redirect":"/..."} — o
        // que a API já declarava, mas nada consumia: o HTMX injetava o JSON
        // cru na página e o usuário ficava parado olhando para ele.
        //
        // Só age quando a resposta é JSON com `redirect`; respostas HTML
        // (relatórios, KPIs, parciais) seguem o swap normal do HTMX.
        document.body.addEventListener("htmx:beforeSwap", function (evento) {
            var xhr = evento.detail.xhr;
            if (!xhr) {
                return;
            }
            var tipo = xhr.getResponseHeader("Content-Type") || "";
            if (tipo.indexOf("json") === -1) {
                // 400 em HTML é recado para quem usa (filtro com data
                // inválida, por exemplo).  O HTMX não faz swap de 4xx por
                // padrão, e a tela ficaria parada sem dizer o que houve.
                if (xhr.status === 400 && tipo.indexOf("html") !== -1) {
                    evento.detail.shouldSwap = true;
                    evento.detail.isError = false;
                }
                return;
            }
            var corpo;
            try {
                corpo = JSON.parse(xhr.responseText);
            } catch (erro) {
                return;
            }
            if (corpo && corpo.status === "ok" && corpo.redirect) {
                evento.detail.shouldSwap = false;
                window.location.href = corpo.redirect;
                return;
            }
            function escapar(texto) {
                return String(texto).replace(/[&<>"']/g, function (c) {
                    return { "&": "&amp;", "<": "&lt;", ">": "&gt;",
                             '"': "&quot;", "'": "&#39;" }[c];
                });
            }
            if (corpo && corpo.status === "erro" && corpo.mensagem) {
                // Erro de credencial vira mensagem legível em vez de JSON.
                //
                // `shouldSwap` é o que faz a mensagem aparecer, e é o que
                // faltava: em resposta 4xx o HTMX não faz swap nenhum por
                // padrão, então este ramo montava o alerta e o descartava.
                // Efeito para quem usava: errar a senha no login não mostrava
                // nada — a tela ficava parada, sem dizer o que houve.
                // `isError` sozinho só evita o log de erro no console.
                evento.detail.serverResponse =
                    '<div class="alert alert-error">' + escapar(corpo.mensagem) + "</div>";
                evento.detail.shouldSwap = true;
                evento.detail.isError = false;
                return;
            }
            // Sucesso COM mensagem e SEM redirect — é o caso do upload de
            // ECD/EFD/ECF.  Nenhum ramo cobria isso, então o HTMX injetava o
            // JSON cru em `#upload-result`: depois de importar uma
            // escrituração inteira, o usuário via
            // `{"status":"ok","mensagem":...}` na tela.  A classe
            // `.alert-success` já existia no CSS e nada no projeto a produzia.
            if (corpo && corpo.status === "ok" && corpo.mensagem) {
                evento.detail.serverResponse =
                    '<div class="alert alert-success">' + escapar(corpo.mensagem) + "</div>";
            }
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
