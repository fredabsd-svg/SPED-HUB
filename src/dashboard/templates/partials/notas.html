<!-- Notas Explicativas Partial (HTMX) — Fase 6 -->
<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;">
    <button class="btn btn-sm btn-outline"
            hx-get="/api/export/pdf?ecd_id={{ ecd_id }}&tipo=notas"
            hx-target="_blank">📄 PDF</button>
</div>

{% if notas %}
<div style="display:flex;flex-direction:column;gap:16px;">
    {% for nota in notas %}
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
            <span style="background:var(--primary);color:white;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;">{{ nota.numero }}</span>
            <h4 style="margin:0;font-size:1rem;">{{ nota.titulo }}</h4>
            {% if nota.valor != 0 %}
            <span style="margin-left:auto;font-weight:700;font-family:monospace;">{{ fmt_moeda(nota.valor) }}</span>
            {% endif %}
        </div>
        <p style="margin:0;font-size:.85rem;line-height:1.6;color:var(--gray-600);text-align:justify;">{{ nota.texto }}</p>
    </div>
    {% endfor %}
</div>
{% else %}
<div style="text-align:center;padding:32px;color:var(--gray-400);">
    <p>Nenhuma nota explicativa disponível para esta ECD.</p>
</div>
{% endif %}
