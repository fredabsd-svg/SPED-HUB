# ── SPED-HUB Docker Compose ──
# Produção: nginx + SSL (Let's Encrypt) + backend FastAPI + Redis

services:
  # ── Redis (Cache + Fila) ──
  redis:
    image: redis:7-alpine
    container_name: sped-hub-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Migração de schema (roda uma vez, antes de web e worker) ──
  # O advisory lock já protegeria contra dois processos migrando ao mesmo
  # tempo, mas ter um lugar único onde a migração acontece torna o log
  # legível quando algo dá errado.  Ver docs/migrations.md.
  migrate:
    build: .
    container_name: sped-hub-migrate
    command: python -m src.cli migrar aplicar
    volumes:
      - sped_hub_data:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/sped_hub.db}
      - PYTHONPATH=/app
    restart: "no"

  # ── Backend FastAPI ──
  web:
    build: .
    container_name: sped-hub-web
    expose:
      - "8000"
    volumes:
      - sped_hub_data:/app/data
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/sped_hub.db}
      # Precisa ser o mesmo caminho no web e no worker, apontando para o
      # volume compartilhado: o web grava o upload, o worker lê.
      - SPED_HUB_UPLOAD_DIR=/app/uploads
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@sped-hub.local}
      - SPED_HUB_MAX_UPLOAD_MB=${SPED_HUB_MAX_UPLOAD_MB:-200}
      # Há nginx na frente sobrescrevendo X-Forwarded-For, então aqui
      # o cabeçalho é confiável e o limite por IP vê o cliente real.
      - SPED_HUB_TRUST_PROXY=true
      - SPED_HUB_LOG_JSON=${SPED_HUB_LOG_JSON:-true}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Worker (processamento assíncrono) ──
  worker:
    build: .
    container_name: sped-hub-worker
    command: python -m src.worker_runner
    volumes:
      - sped_hub_data:/app/data
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/sped_hub.db}
      - SPED_HUB_UPLOAD_DIR=/app/uploads
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - WORKER_COUNT=${WORKER_COUNT:-4}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Nginx (proxy reverso + SSL) ──
  nginx:
    build:
      context: ./deploy/nginx
    container_name: sped-hub-nginx
    ports:
      - "80:80"
      - "443:443"
    # O entrypoint decide o certificado antes de o nginx subir.  Sem ele, o
    # nginx apontava para um Let's Encrypt inexistente e o container entrava em
    # laço de reinício em toda instalação nova.
    environment:
      # Domínio do certificado.  Sem ele, o nginx sobe com autoassinado e serve
      # a aplicação em HTTP — o caminho de quem está experimentando local.
      - SPED_HUB_DOMINIO=${SPED_HUB_DOMINIO:-sped-hub}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Escrita: é aqui que o certificado autoassinado e os includes gerados
      # ficam.  O /etc/letsencrypt segue somente-leitura, que é o certo — o
      # nginx não tem por que escrever lá.
      - nginx_ssl:/etc/nginx/ssl
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: unless-stopped

  # ── Certbot (Let's Encrypt) ──
  certbot:
    image: certbot/certbot:latest
    container_name: sped-hub-certbot
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  nginx_ssl:
    driver: local
  sped_hub_data:
    driver: local
  redis_data:
    driver: local