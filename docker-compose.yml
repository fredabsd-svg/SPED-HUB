  #     - .:/app
  #     - sped_hub_data:/app/data
  #   environment:
  #     - SPED_HUB_DB=/app/data/sped_hub.db
  #     - PYTHONPATH=/app
  #   command: python -m uvicorn src.dashboard.app:app --host 0.0.0.0 --port 8000 --reload
  #   restart: unless-stopped

volumes:
  sped_hub_data:
    driver: local