# ── SPED-HUB Nginx Configuration ──
# Produção: proxy reverso + SSL (Let's Encrypt) + gzip + segurança

upstream sped_hub_backend {
    server web:8000;
}

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    server_name _;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──
server {
    listen 443 ssl http2;
    server_name _;

    # SSL — substitua pelos caminhos reais dos certificados
    ssl_certificate     /etc/letsencrypt/live/sped-hub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sped-hub/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    # `includeSubDomains` e `preload` ficam de fora de propósito: só devem
    # entrar depois que TODOS os subdomínios estiverem em HTTPS, e o preload
    # é praticamente irreversível.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Content-Security-Policy
    #
    # A política reflete o que a aplicação realmente usa hoje:
    #   * scripts: próprio domínio + cdn.jsdelivr.net (HTMX, Alpine, Chart.js,
    #     SortableJS) e blocos <script> inline nos templates;
    #   * 'unsafe-eval': o Alpine.js avalia as expressões dos atributos
    #     x-data/x-show em runtime e não funciona sem ele;
    #   * 'unsafe-inline' em style: os templates usam style="" em ~30 pontos.
    # Tirar os 'unsafe-*' exige migrar os inlines para arquivos e adotar
    # nonce por requisição — trabalho de front-end, não de configuração.
    # Mesmo assim, a política já bloqueia exfiltração para domínios
    # arbitrários, iframes e envio de formulário para fora.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

    # Logs
    access_log /var/log/nginx/sped-hub-access.log;
    error_log  /var/log/nginx/sped-hub-error.log;

    # Upload size limit (arquivos ECD podem ser grandes)
    # Acompanha SPED_HUB_MAX_UPLOAD_MB (default 200): se ficar menor, o
    # nginx corta com 413 antes de a aplicação validar o arquivo.
    client_max_body_size 200M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Proxy para o backend FastAPI
    location / {
        proxy_pass http://sped_hub_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts para uploads grandes
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Static files (se houver)
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}