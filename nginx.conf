# ── SPED-HUB Nginx Configuration ──
# Produção: proxy reverso + SSL (Let's Encrypt) + gzip + segurança

# O DNS embutido do Docker.  É preciso declará-lo porque o repasse resolve o
# nome do backend por requisição, e não na subida — ver `deploy/nginx/proxy.conf`
# para o motivo.  `ipv6=off` porque a rede padrão do compose é só IPv4, e sem
# isso cada requisição gasta uma consulta AAAA que sempre falha.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    server_name _;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # O conteúdo vem do entrypoint: `return 301` quando existe certificado
    # real, ou o repasse para a aplicação quando o certificado é autoassinado.
    location / {
        include /etc/nginx/ssl/http-raiz.conf;
    }
}

# ── HTTPS ──
server {
    listen 443 ssl;
    # `listen ... http2` está depreciado desde o nginx 1.25 e gerava aviso a
    # cada subida.
    http2 on;
    server_name _;

    # Os caminhos vêm do entrypoint: Let's Encrypt quando existe, autoassinado
    # quando não.  Apontar direto para o Let's Encrypt fazia o nginx recusar
    # subir em toda instalação nova.
    include /etc/nginx/ssl/certificado.conf;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    # `includeSubDomains` e `preload` ficam de fora de propósito: só devem
    # entrar depois que TODOS os subdomínios estiverem em HTTPS, e o preload
    # é praticamente irreversível.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Content-Security-Policy
    #
    # A política reflete o que a aplicação realmente usa hoje:
    #   * scripts: apenas o próprio domínio — htmx, Alpine, Chart.js e
    #     SortableJS são servidos de /static/vendor/, não de CDN — mais os
    #     blocos <script> inline dos templates;
    #   * 'unsafe-eval': o Alpine.js avalia as expressões dos atributos
    #     x-data/x-show em runtime e não funciona sem ele;
    #   * 'unsafe-inline' em style: os templates usam style="" em ~30 pontos.
    # Tirar os 'unsafe-*' exige migrar os inlines para arquivos e adotar
    # nonce por requisição — trabalho de front-end, não de configuração.
    # Sem origem externa no script-src, um script injetado não consegue nem
    # se carregar de fora nem exfiltrar para domínio arbitrário.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

    # Logs
    access_log /var/log/nginx/sped-hub-access.log;
    error_log  /var/log/nginx/sped-hub-error.log;

    # Upload size limit (arquivos ECD podem ser grandes)
    # Acompanha SPED_HUB_MAX_UPLOAD_MB (default 200): se ficar menor, o
    # nginx corta com 413 antes de a aplicação validar o arquivo.
    client_max_body_size 200M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Proxy para o backend FastAPI
    location / {
        include /etc/nginx/proxy.conf;
    }

    # Static files (se houver)
    location /static/ {
        # Os estáticos ficam dentro do pacote (WORKDIR=/app no Dockerfile).
        # O alias apontava para /app/static/, que nunca existiu — toda
        # requisição a /static/ caía em 404 no nginx.
        alias /app/src/dashboard/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}