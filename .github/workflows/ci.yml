name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite que release.yml reaproveite esta suíte antes de publicar a
  # imagem, em vez de duplicar os passos.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (WeasyPrint)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libcairo2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Check formatting with black
        run: black --check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # As divergências entre SQLite e Postgres são silenciosas em SQLite — só
  # aparecem rodando contra um servidor de verdade.
  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sped
          POSTGRES_PASSWORD: sped
          POSTGRES_DB: sped_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (WeasyPrint)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libcairo2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      # A lista é fixa de propósito (o resto da suíte já roda no job `test`),
      # mas arquivo de teste que use TEST_DATABASE_URL e não apareça aqui é
      # teste que nunca roda contra Postgres — e ninguém percebe, porque ele
      # "passa" pulando. `TestCoberturaDoPostgres` no test_regras_projeto.py
      # falha se algum ficar de fora.
      - name: Run portability and migration suites against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sped:sped@localhost:5432/sped_hub_test
        run: pytest tests/test_multibackend.py tests/test_migrations.py tests/test_migracao_de_dados.py -v --tb=short

  # Fluxo completo em navegador real (ADR 0005).  Ficou fora do CI enquanto a
  # causa das falhas era desconhecida; ela era um laço infinito no dashboard,
  # não defeito de harness.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (WeasyPrint)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libcairo2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run browser tests
        run: pytest -m e2e -v --tb=short --junitxml=e2e.xml

      # Um job que pula tudo e reporta verde afirma cobertura que não houve.
      - name: Fail if every browser test was skipped
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("e2e.xml").getroot().find("testsuite")
          total = int(suite.get("tests", 0))
          pulados = int(suite.get("skipped", 0))
          print(f"{total} testes, {pulados} pulados")
          if total == 0 or pulados == total:
              sys.exit(
                  "nenhum teste de navegador chegou a rodar — provavelmente "
                  "não há navegador no runner. Verde aqui seria mentira (ADR 0005)."
              )
          PY

  # Roda em PR também.  Enquanto este job era `if: github.ref ==
  # 'refs/heads/main'`, o build da imagem só era exercitado DEPOIS do merge:
  # não havia como um PR ser barrado por quebrar o Dockerfile, só como o main
  # ficar vermelho depois do fato.  Foi exatamente assim que a renomeação do
  # pacote gdk-pixbuf no Debian trixie entrou.
  docker:
    runs-on: ubuntu-latest
    needs: [test, postgres]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sped-hub .

      # O nginx apontava direto para o certificado do Let's Encrypt e recusava
      # subir em instalação nova, deixando o container em laço de reinício.
      # Conferir arquivo não pega isso: só pega subindo o container sem
      # certificado e sem backend, que é o estado de quem roda
      # `docker compose up` pela primeira vez.
      - name: nginx sobe sem certificado e sem backend
        run: |
          set -eux
          docker build -t sped-hub-nginx ./deploy/nginx

          # Rede própria: é onde o DNS embutido do Docker (127.0.0.11) existe,
          # como na rede do compose. Na bridge padrão ele não responde.
          docker network create sped-hub-teste
          docker run -d --name nginx-teste --network sped-hub-teste -p 8080:80 \
            -e SPED_HUB_DOMINIO=exemplo.teste \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            sped-hub-nginx

          # 15s cobre a geração do autoassinado com folga; o laço de reinício
          # que este teste procura já teria acontecido várias vezes até lá.
          sleep 15
          docker logs nginx-teste

          # O container tem de estar de pé — não reiniciando, não morto.
          test "$(docker inspect -f '{{.State.Running}}' nginx-teste)" = true
          test "$(docker inspect -f '{{.State.Restarting}}' nginx-teste)" = false
          # `RestartCount` fica na raiz do inspect, não dentro de `.State`.
          test "$(docker inspect -f '{{.RestartCount}}' nginx-teste)" = 0

          # Sem certificado real: avisa que é autoassinado e serve a aplicação
          # em HTTP, sem redirecionar (redirecionar para um HTTPS autoassinado
          # só rende aviso do navegador).
          docker logs nginx-teste 2>&1 | grep -q AUTOASSINADO

          # 5xx é o certo aqui: não há backend. O que não pode é o nginx
          # morrer por causa disso — antes, nem chegava a responder.
          codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 http://127.0.0.1:8080/)
          echo "nginx respondeu $codigo sem backend"
          case "$codigo" in 5??) ;; *) echo "esperado 5xx, veio $codigo"; exit 1;; esac

          # Nenhum aviso de diretiva depreciada na subida.
          if docker logs nginx-teste 2>&1 | grep -q 'directive is deprecated'; then
            echo 'nginx reclamou de diretiva depreciada'; exit 1
          fi

          docker rm -f nginx-teste

          # Mesmo cenário, mas com o entrypoint em CRLF — o que o Git no
          # Windows entrega por padrão.  Sem normalização, o shebang vira
          # `#!/bin/sh\r`, o kernel não acha o interpretador e o container
          # morre com "no such file or directory" apontando para o script que
          # está lá.  Nenhum outro job veria: todos rodam em Linux.
          sed -i 's/$/\r/' deploy/nginx/entrypoint.sh
          docker build -t sped-hub-nginx-crlf ./deploy/nginx
          docker run -d --name nginx-crlf --network sped-hub-teste \
            -e SPED_HUB_DOMINIO=exemplo.teste \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            sped-hub-nginx-crlf
          sleep 10
          docker logs nginx-crlf
          test "$(docker inspect -f '{{.State.Running}}' nginx-crlf)" = true
          test "$(docker inspect -f '{{.RestartCount}}' nginx-crlf)" = 0
          docker logs nginx-crlf 2>&1 | grep -q AUTOASSINADO
          git checkout deploy/nginx/entrypoint.sh

          docker rm -f nginx-crlf
          docker network rm sped-hub-teste